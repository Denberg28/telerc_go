name: Build both motor firmware stacks
on:
  push:
    branches: ['firmware/go-motor-stacks']
  pull_request:
    paths: ['bridge/**', 'scripts/**', 'docs/FIRMWARE_STACKS*', '.github/workflows/motor-stacks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motor-stacks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Source, host, full sanitizers and archive regression
        run: |
          python3 bridge/sync_motor_core.py --check
          python3 scripts/sync-go-core.py --check
          bridge/tests/run.sh
          SANITIZE=1 bridge/tests/run.sh
          bridge/go_4wd_tests/run.sh
          SANITIZE=1 bridge/go_4wd_tests/run.sh
          bridge/spring_car_tests/run.sh
          SANITIZE=1 bridge/spring_car_tests/run.sh
          python3 -m unittest discover -s scripts -p 'test_*release*.py' -v
          python3 -m unittest discover -s scripts -p 'test_*package*.py' -v
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"'
      - name: Unchanged app regression, debug/release lint/build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease :go:testDebugUnitTest :go:lintDebug :go:lintRelease :go:assembleDebug :go:assembleRelease --no-daemon
  build:
    needs: [host, android]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with: {version: '1.3.1'}
      - name: Install pinned target toolchain
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile both actual ESP32-S3 layouts and validate packages
        run: |
          python3 scripts/build_motor_stacks.py --output "$RUNNER_TEMP/motor-stacks" --commit "$GITHUB_SHA"
          mkdir firmware-dist
          cp "$RUNNER_TEMP/motor-stacks/"*.zip "$RUNNER_TEMP/motor-stacks/SHA256SUMS.txt" firmware-dist/
          python3 scripts/release_safety.py firmware-dist
          cd firmware-dist
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TeleRC-Go-motor-firmware-stacks
          path: firmware-dist/
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/firmware/go-motor-stacks'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TeleRC-Go-motor-firmware-stacks
          path: firmware-dist
      - name: Publish separate firmware prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd firmware-dist
          sha256sum -c SHA256SUMS.txt
          cd ..
          tag=go-firmware-stacks-v0.3.0-rc1
          gh release create "$tag" firmware-dist/*.zip firmware-dist/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --latest=false --title "TeleRC Go firmware stacks: 4WD + drive/steering" --notes-file docs/FIRMWARE_STACKS_RELEASE.md
