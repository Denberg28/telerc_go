name: Build and publish Go 1.0.12 stable with motor firmware
on:
  push:
    branches: [release/go-v1.0.12]
    paths: [.github/workflows/publish-go-112.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: go-v1.0.12-publication-final
  cancel-in-progress: false
env:
  GO_SOURCE: 93d9a0cbcab27a86e662f842e85cd0096de1f907
  GO_CHECK_RUN: '42210956522'
  SIGN_RUN: '42211210001'
  FIRMWARE_RUN: '42211093815'
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 93d9a0cbcab27a86e662f842e85cd0096de1f907
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"'
      - name: Require exact successful Android, native and signing producers
        run: |
          gh run watch "$GO_CHECK_RUN" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
          gh run watch "$SIGN_RUN" --repo Denberg28/TeleRC --exit-status --interval 10
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/127869624344" > "$RUNNER_TEMP/firmware-job.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GO_CHECK_RUN" > "$RUNNER_TEMP/check-run.json"
          gh api "repos/Denberg28/TeleRC/actions/runs/$SIGN_RUN" > "$RUNNER_TEMP/sign-run.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          checked=json.loads((Path(os.environ['RUNNER_TEMP'])/'check-run.json').read_text())
          signed=json.loads((Path(os.environ['RUNNER_TEMP'])/'sign-run.json').read_text())
          assert checked['head_sha']==os.environ['GO_SOURCE'] and checked['conclusion']=='success'
          firmware=json.loads((Path(os.environ['RUNNER_TEMP'])/'firmware-job.json').read_text())
          assert firmware['run_id']==int(os.environ['FIRMWARE_RUN']) and firmware['conclusion']=='success'
          assert signed['head_sha']=='668636eca05a5924353c41a7dc3251ea3a0b479f' and signed['conclusion']=='success'
          PY
      - name: Download exact verified firmware producer
        run: gh run download "$FIRMWARE_RUN" --repo "$GITHUB_REPOSITORY" --name Go-1.0.12-matching-motor-firmware --dir firmware-dist
      - name: Download immutable signed APK and native evidence
        run: |
          gh run download "$SIGN_RUN" --repo Denberg28/TeleRC --name TeleRC-Go-v1.0.12-retained-signer --dir "$RUNNER_TEMP/signed"
          gh run download "$GO_CHECK_RUN" --repo "$GITHUB_REPOSITORY" --name TeleRC-Go-checks --dir "$RUNNER_TEMP/checks"
          gh run download "$GO_CHECK_RUN" --repo "$GITHUB_REPOSITORY" --name TeleRC-Go-wallpaper-evidence --dir "$RUNNER_TEMP/native"
          mkdir release-dist
          cp -a "$RUNNER_TEMP/signed/release-dist/." release-dist/
          mkdir -p go/build/test-results
          cp -a "$RUNNER_TEMP/signed/go/build/test-results/." go/build/test-results/
          (cd release-dist && sha256sum -c SIGNER_SHA256SUMS.txt)
          cp firmware-dist/*.zip release-dist/
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/release-dist/TeleRC-Go-v1.0.12-test-evidence.zip" checks native)
      - name: Independently verify APK, source and firmware provenance
        run: |
          curl --fail --location --retry 2 https://github.com/Denberg28/telerc_go/releases/download/go-v1.0.11/TeleRC-Go-v1.0.11.apk --output "$RUNNER_TEMP/baseline.apk"
          python3 release-dist/VERIFY_APK.py release-dist/TeleRC-Go-v1.0.12.apk "$RUNNER_TEMP/baseline.apk"
          python3 - <<'PY'
          import json,os,zipfile
          from pathlib import Path
          import sys
          sys.path.insert(0,'scripts')
          from build_motor_stacks import validate_archive
          out=Path('release-dist')
          source=os.environ['GO_SOURCE']
          provenance=json.loads((out/'SIGNING_PROVENANCE.json').read_text())
          assert provenance['source_commit']==source and provenance['signing_workflow_run']==int(os.environ['SIGN_RUN'])
          assert provenance['signing_workflow_commit']=='668636eca05a5924353c41a7dc3251ea3a0b479f'
          with zipfile.ZipFile(out/'telerc_go-v1.0.12-source.zip') as z:
              assert z.read('SOURCE_COMMIT.txt').decode().strip()==source
          for p in out.glob('*Candidate.zip'): validate_archive(p,source)
          PY
      - name: Package stable-channel release notes and SHA-256 inventory
        run: |
          cp docs/GO_PROPORTIONAL_112.md release-dist/TEST_GUIDE.md
          cp docs/FIRMWARE_STACKS.md release-dist/FIRMWARE_STACKS.md
          cp docs/FIRMWARE_STACKS_FLASH.md release-dist/FLASH.md
          cp docs/SPRING_CAR.md release-dist/SPRING_CAR.md
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path('release-dist')
          notes='''# TeleRC Go 1.0.12 — stable release
          
          Joystick line percentages now request proportional usable control strength
          after independent Steer/Drive sensitivity. Test applies the request on the
          next simulation frame instead of adding acceleration lag. Live latest-value
          RC cadence is 20 ms. The fixed center neutral guard and explicit ARM remain.
          
          Install TeleRC-Go-v1.0.12.apk over existing production Go. Version code 1008,
          same package and retained production signer as 1.0.11; no uninstall needed.
          Manual download is available here. The existing legacy in-app update feed
          is unchanged. Retain the previous APK and saved data for rollback.
          
          Included matching ESP32-S3/MX1508 firmware:
          - TeleRC-Go-4WD-v1.3.0-Candidate.zip: four drive motors, differential steering.
          - TeleRC-Go-SpringCar-v0.2.0-Candidate.zip: rear drive/front two-wire steering,
            estimated travel, electrical brake, calibrated return and saved recalibration.
          
          Both archives include Arduino IDE sketches, actual-board binaries, tests,
          wiring, flash helper, exact-source manifests and checksums. Select the archive
          matching your wiring; both use a regulated 5 V motor rail from the 2S pack.
          No reflash is needed solely for this app fix. SpringCar has no position sensor;
          a fixed steering angle is not guaranteed against its centering spring.
          
          Verified: Android debug/release build and lint, 68 Go JVM tests, full-app
          regressions, native API 35 touch/marker/maze/gallery checks, host/full
          sanitizers, archive regressions, retained APK signer/increasing code, and
          both actual ESP32-S3 builds with Arduino-ESP32 3.3.2.
          
          Stable channel selected explicitly by the owner on 6 November 2026.
          Physical phone upgrade, loaded motor onset, current/temperature, stopping
          latency, steering drift and field endurance remain NOT TESTED. Firmware
          archive Candidate labels and hardware_validated=false remain accurate.
          Follow TEST_GUIDE.md and the restrained-wheel procedures before normal use.
          '''
          (out/'RELEASE_NOTES.md').write_text(notes)
          status=dict(version='1.0.12',version_code=1008,channel='stable',owner_authorized=True,source_commit=os.environ['GO_SOURCE'],hardware_validated=False,android_native_run=int(os.environ['GO_CHECK_RUN']),signing_run=int(os.environ['SIGN_RUN']),firmware_build_run=int(os.environ['FIRMWARE_RUN']),publication_run=int(os.environ['GITHUB_RUN_ID']))
          (out/'RELEASE_STATUS.json').write_text(json.dumps(status,indent=2)+'\n')
          (out/'BUILD_INFO.txt').write_text('TeleRC Go 1.0.12/code1008\nSource: '+os.environ['GO_SOURCE']+'\nAndroid/native: https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GO_CHECK_RUN']+'\nSigning: https://github.com/Denberg28/TeleRC/actions/runs/'+os.environ['SIGN_RUN']+'\nFirmware/publication: https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+'\nStable channel owner-selected; physical hardware qualification NOT TESTED.\n')
          (out/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir()) if p.is_file() and p.name!='SHA256SUMS.txt'))
          PY
          python3 scripts/release_safety.py release-dist
          (cd release-dist && sha256sum -c SHA256SUMS.txt)
      - name: Publish requested stable release
        run: |
          gh release create go-v1.0.12 --repo "$GITHUB_REPOSITORY" --target "$GO_SOURCE" --draft --latest=false --title 'TeleRC Go 1.0.12 — stable proportional controls + firmware' --notes-file release-dist/RELEASE_NOTES.md release-dist/*
          gh release edit go-v1.0.12 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          gh release view go-v1.0.12 --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets > release-state.json
          python3 - <<'PY'
          import json
          v=json.load(open('release-state.json'))
          assert not v['isDraft'] and not v['isPrerelease']
          assert len(v['assets'])>=14
          print(v['url'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeleRC-Go-1.0.12-stable-distribution
          path: |
            release-dist/
            release-state.json
          if-no-files-found: warn
